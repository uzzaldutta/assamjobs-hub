name: Automated Feed Ingestion (Continuous Cloud Automation)

on:
  schedule:
    # Runs 6 times daily (every 3-4 hours during peak publishing hours):
    # 00:30 UTC = 6:00 AM IST (Early morning notices)
    - cron: '30 0 * * *'
    # 03:30 UTC = 9:00 AM IST (Morning official circulars)
    - cron: '30 3 * * *'
    # 06:30 UTC = 12:00 PM IST (Midday updates)
    - cron: '30 6 * * *'
    # 09:30 UTC = 3:00 PM IST (Afternoon notifications)
    - cron: '30 9 * * *'
    # 12:30 UTC = 6:00 PM IST (Evening exam results & admit cards)
    - cron: '30 12 * * *'
    # 15:30 UTC = 9:00 PM IST (Nightly wrap-up & late releases)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ingest:
    name: Crawl & Ingest Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Production Ingestion Endpoint
        run: |
          echo "Executing automated continuous feed extraction at $(date -u)"
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "https://assamjobshub.com/api/cron/ingestion?token=assamhub_cron_2026" -H "User-Agent: AssamJobsHub-AutoCron/1.0" --max-time 180)
          echo "$HTTP_RESPONSE"
          
          STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Ingestion failed with HTTP status $STATUS"
            exit 1
          fi
          echo "Automated feed extraction completed and published successfully!"
